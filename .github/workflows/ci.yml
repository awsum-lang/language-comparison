name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      # New commits pushed to the HEAD of an open PR.
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# One job per language. Each installs only that language's toolchain — the
# latest stable release (Roc: the latest nightly, its only channel; Awsum: the
# release this repo is tagged in lockstep with) — and runs `just test
# <language>`, the same per-language assert-behavior.sh a local `just test`
# runs. When a new release changes an outcome, the job goes red and the entry
# gets re-recorded.
jobs:
  awsum:
    name: Awsum (every target)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      # Compiler version downloaded from awsum-lang/awsum GitHub Releases.
      AWSUM_VERSION: 0.0.8

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # The LLVM backend pipes generated `.ll` through `clang`, which must be
      # LLVM 15+ for opaque pointers.
      - name: Set up LLVM 15
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-15
          sudo ln -sf /usr/bin/clang-15 /usr/local/bin/clang

      - name: Verify clang resolves to LLVM 15+
        run: |
          set -eu
          clang --version
          if clang --version | head -n1 | grep -qE 'version (1[5-9]|[2-9][0-9])\.'; then
            echo "OK: clang is LLVM 15+"
          else
            echo "ERROR: clang is older than LLVM 15"
            exit 1
          fi

      # JVM / CLR / WASM / JS runtimes. Versions match awsum's own CI, so a demo
      # can't pass here on a runtime version the compiler's tests don't cover.
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "25.0.5+8"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.403"

      - name: Set up Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
        with:
          version: "v50.0.1"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.0"

      - name: Install awsum from GitHub Release
        run: |
          set -euo pipefail
          url="https://github.com/awsum-lang/awsum/releases/download/v${AWSUM_VERSION}/awsum-${AWSUM_VERSION}-linux-x86_64-gnu.tar.gz"
          dest="$RUNNER_TEMP/awsum"
          mkdir -p "$dest"
          curl -fsSL --retry 3 --retry-delay 2 -o "$dest/awsum.tar.gz" "$url"
          tar -C "$dest" -xzf "$dest/awsum.tar.gz"
          chmod +x "$dest/awsum"
          echo "$dest" >> "$GITHUB_PATH"

      - name: Verify awsum
        run: awsum --version

      - name: Assert recorded behavior
        run: just test awsum

  csharp:
    name: "C#"
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10"

      - name: Assert recorded behavior
        run: just test csharp

  elm:
    name: Elm
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      # elm make fetches packages from package.elm-lang.org on every run, and a
      # single transient fetch can fail. Cache them across runs and retry the
      # build so the assert step never touches the network.
      - name: Cache elm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.elm
            stack-safe-recursion/elm/elm-stuff
          key: elm-${{ runner.os }}-${{ hashFiles('stack-safe-recursion/elm/elm.json') }}

      - name: Install & build (retried — elm's package fetch is network-flaky)
        working-directory: stack-safe-recursion/elm
        run: |
          npm install --no-audit --no-fund --loglevel=error
          n=0
          until npm run build; do
            n=$((n + 1)); [ "$n" -ge 3 ] && { echo "build failed after $n attempts"; exit 1; }
            echo "build attempt $n failed; retrying in 10s"; sleep 10
          done

      - name: Assert recorded behavior
        run: just test elm

  fsharp:
    name: "F#"
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10"

      - name: Assert recorded behavior
        run: just test fsharp

  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Assert recorded behavior
        run: just test go

  haskell:
    name: Haskell
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up stack
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          enable-stack: true
          stack-no-global: true

      # GHC for the stack.yaml snapshot lives under ~/.stack — without this
      # cache every run re-installs it.
      - name: Cache ~/.stack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.stack
          key: stack-${{ runner.os }}-${{ hashFiles('stack-safe-recursion/haskell/stack.yaml', 'stack-safe-recursion/haskell/stack.yaml.lock', 'stack-safe-recursion/haskell/package.yaml') }}

      - name: Assert recorded behavior
        run: just test haskell

  java:
    name: Java
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Assert recorded behavior
        run: just test java

  koka:
    name: Koka
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install koka 3.2.3
        # sudo: the installer decides it can skip sudo when the exe copies into
        # /usr/local/bin without it, but on GitHub runners /usr/local/lib is
        # root-owned, so the later library copy fails. Run the whole thing as root.
        run: curl -sSL https://github.com/koka-lang/koka/releases/download/v3.2.3/install.sh | sudo sh

      - name: Assert recorded behavior
        run: just test koka

  ocaml:
    name: OCaml
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: "5"

      # `ocamlopt` lives in the opam switch, not on the default PATH for a plain
      # `run:` step — `opam exec --` runs the assert inside the opam environment.
      - name: Assert recorded behavior
        run: opam exec -- just test ocaml

  purescript:
    name: PureScript
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      # spago fetches the PureScript package set from the registry on every run,
      # and a single transient fetch can fail ("request failed"). Cache it across
      # runs and retry the build so the assert step never touches the network.
      - name: Cache spago
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/spago
            stack-safe-recursion/purescript/.spago
          key: spago-${{ runner.os }}-${{ hashFiles('stack-safe-recursion/purescript/spago.lock') }}

      - name: Install & build (retried — spago's registry fetch is network-flaky)
        working-directory: stack-safe-recursion/purescript
        run: |
          npm install --no-audit --no-fund --loglevel=error
          n=0
          until npm run build; do
            n=$((n + 1)); [ "$n" -ge 3 ] && { echo "build failed after $n attempts"; exit 1; }
            echo "build attempt $n failed; retrying in 10s"; sleep 10
          done

      - name: Assert recorded behavior
        run: just test purescript

  roc:
    name: Roc
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Roc has no stable release yet — nightlies are its only channel — so this
      # tracks the latest one from roc-lang/nightlies.
      - name: Install roc (latest nightly)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url=$(curl -fsSL --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/roc-lang/nightlies/releases/latest \
            | jq -r '.assets[] | select(.name | test("^roc_nightly-linux_x86_64-.*\\.tar\\.gz$")) | .browser_download_url')
          test -n "$url"
          echo "Installing $url"
          dest="$RUNNER_TEMP/roc"
          mkdir -p "$dest"
          curl -fsSL --retry 3 --retry-delay 2 -o "$dest/roc.tar.gz" "$url"
          tar -C "$dest" --strip-components=1 -xzf "$dest/roc.tar.gz"
          echo "$dest" >> "$GITHUB_PATH"

      - name: Assert recorded behavior
        run: just test roc

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Assert recorded behavior
        run: just test rust

  scala:
    name: Scala 3
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "sbt"

      - name: Set up sbt
        uses: sbt/setup-sbt@b113b960ba361e87e08ce02a390d51871b7ee459 # v1.5.13

      - name: Assert recorded behavior
        run: just test scala

  typescript:
    name: TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Assert recorded behavior
        run: just test typescript

  zig:
    name: Zig
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Zig is pre-1.0 with high API churn; this program targets 0.16's IO model
      # (process.Init main, the post-Writergate stdout API). Pin it and bump
      # together with re-recording the entry.
      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Assert recorded behavior
        run: just test zig
